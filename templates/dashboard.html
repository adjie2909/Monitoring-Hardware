  {% extends "base.html" %} 
  {% block title %}Dashboard - Hardware Health Tracker{% endblock %} 
  
  {% block content %}
    <!-- Dashboard KPI Cards -->
    <div id="kpi-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
      <!-- Injected by JS -->
    </div>
  
    <!-- Hardware Table -->
    <section class="bg-white rounded-xl shadow-sm border p-6 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
          <i class="fas fa-laptop"></i> All Devices
        </h3>
        <button onclick="pingAll()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
          <i class="fas fa-sync-alt" id="refresh-icon"></i> Ping Now
        </button>
      </div>
  
      <!-- Button to trigger Modal -->
      <div class="mb-6">
        <button onclick="toggleModal('add-modal', true)" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium flex items-center gap-2">
          <i class="fas fa-plus"></i> Tambah PC Baru
        </button>
      </div>
  
      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">Tag</th>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">Device</th>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">Category</th>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">Location</th>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">IP Address</th>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">Ping Status</th>
              <th class="px-4 py-2.5 text-xs font-semibold text-blue-600 uppercase">Health</th>
            </tr>
          </thead>
          <tbody id="hw-table" class="divide-y divide-gray-200">
            <!-- Injected by JS -->
          </tbody>
        </table>
      </div>
      <div id="no-data" class="hidden text-center py-8 text-gray-500">No devices registered yet.</div>
    </section>
  
    <!-- Modal Add Hardware -->
    <div id="add-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b flex justify-between items-center">
          <h3 class="text-xl font-bold text-gray-800">Tambah Hardware Baru</h3>
        </div>
        <form id="add-form" class="p-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">Asset Tag</label>
              <input name="asset_tag" placeholder="e.g. PC-KASIR-01" required class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">Device Name</label>
              <input name="device_name" placeholder="Name" required class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">Category</label>
              <select name="category" required class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm">
                <option>PC</option><option>Printer Thermal</option><option>Switch</option>
                <option>UPS</option><option>Scanner</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">Location</label>
              <input name="location" placeholder="Location" required class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">IP Address</label>
              <input name="ip_address" placeholder="IP Address" class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">Serial Number</label>
              <input name="serial_number" placeholder="Serial Number" class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-gray-500 uppercase">Purchase Date</label>
              <input name="purchase_date" type="date" class="w-full px-3 py-2 rounded-lg border bg-white focus:border-blue-500 outline-none text-sm" />
            </div>
          </div>
          <div class="mt-6 flex justify-end gap-3">
            <button type="button" onclick="toggleModal('add-modal', false)" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">Batal</button>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>
  
    <script>
      async function load() {
        const res = await fetch('/api/dashboard/summary');
        const data = await res.json();
        document.getElementById('kpi-container').innerHTML = `
          <div class="bg-white p-4 rounded-lg shadow-sm border flex gap-3">
            <div class="text-center"><p class="text-2xl font-bold text-gray-800">${data.total_assets}</p><p class="text-xs text-gray-500">Total Assets</p></div>
            <div class="text-center"><p class="text-2xl font-bold text-yellow-600">${data.upcoming}</p><p class="text-xs text-gray-500">Upcoming</p></div>
            <div class="text-center"><p class="text-2xl font-bold text-red-600">${data.overdue}</p><p class="text-xs text-gray-500">Overdue</p></div>
            <div class="text-center"><p class="text-2xl font-bold text-green-600">${data.active_count}</p><p class="text-xs text-gray-500">Active</p></div>
          </div>`;
  
        const hwRes = await fetch('/api/hardware');
        const hwData = await hwRes.json();
        const tbody = document.getElementById('hw-table');
        if (!hwData.length) { 
          document.getElementById('no-data').classList.remove('hidden'); 
          return; 
        }
        document.getElementById('no-data').classList.add('hidden');
        tbody.innerHTML = hwData.map(d => `
          <tr class="hover:bg-gray-50 transition" id="row-${d.id}">
            <td class="px-4 py-3 font-medium text-sm">
              <a href="/hardware/${d.id}" class="text-blue-600 hover:underline font-semibold">${d.asset_tag}</a>
            </td>
            <td class="px-4 py-3 text-sm text-gray-600">${d.device_name}</td>
            <td class="px-4 py-3 text-sm text-gray-500">${d.category}</td>
            <td class="px-4 py-3 text-sm text-gray-500">${d.location}</td>
            <td class="px-4 py-3 text-sm font-mono text-gray-600">${d.ip_address || '-'}</td>
            <td class="px-4 py-3 text-xs" id="ping-${d.id}">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
                <span class="w-2 h-2 rounded-full bg-gray-400"></span> Checking...
              </span>
            </td>
            <td class="px-4 py-3">
              <span class="inline-badge badge px-2.5 py-1 rounded-full text-xs font-bold ${d.health_color}">
                ${d.health_status}
              </span>
            </td>
          </tr>
        `).join('');
  
        pingAll();
      }
  
      async function pingAll() {
        const icon = document.getElementById('refresh-icon');
        if (icon) icon.classList.add('fa-spin');
        try {
          const res = await fetch('/api/hardware/ping-all');
          const pingResults = await res.json();
          for (const [id, data] of Object.entries(pingResults)) {
            const el = document.getElementById(`ping-${id}`);
            if (!el) continue;
            if (data.status === 'No IP') {
              el.innerHTML = `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-gray-100 text-gray-500">
                  <span class="w-2 h-2 rounded-full bg-gray-400"></span> No IP
                </span>`;
            } else if (data.online) {
              el.innerHTML = `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-700">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online (${data.latency_ms} ms)
                </span>`;
            } else {
              el.innerHTML = `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-100 text-rose-700">
                  <span class="w-2 h-2 rounded-full bg-rose-500"></span> Unreachable
                </span>`;
            }
          }
        } catch (e) {
          console.error(e);
        } finally {
          if (icon) icon.classList.remove('fa-spin');
        }
      }
  
      function toggleModal(id, show) {
        const modal = document.getElementById(id);
        if (show) {
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        } else {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
      }
  
      document.getElementById('add-form').addEventListener('submit', async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        await fetch('/api/hardware/add', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
        e.target.reset();
        toggleModal('add-modal', false);
        load();
      });
  
      load();
      // Auto-ping background refresh setiap 15 detik
      setInterval(pingAll, 15000);
    </script>
  {% endblock %}
